<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Codex Switcher Web</title>
  <desc id="desc">A self-hosted control plane for Codex accounts, workspaces, quotas, authentication, and switching</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07142f"/>
      <stop offset="0.55" stop-color="#102b5c"/>
      <stop offset="1" stop-color="#0a6f73"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54a8ff"/>
      <stop offset="1" stop-color="#53e0c2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020817" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1400" height="620" rx="32" fill="url(#bg)"/>
  <circle cx="1220" cy="82" r="210" fill="#3cd9bd" opacity="0.08"/>
  <circle cx="180" cy="590" r="260" fill="#4b8fff" opacity="0.1"/>
