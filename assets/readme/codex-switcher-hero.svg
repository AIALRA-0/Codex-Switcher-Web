    <path d="M18 32h28M32 18v28" stroke="#06172f" stroke-width="7" stroke-linecap="round"/>
    <text x="88" y="29" fill="#85f2df" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700" letter-spacing="3">SELF-HOSTED CONTROL PLANE</text>
